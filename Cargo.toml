[package]
name = "cosmic-media-applet"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "COSMIC applet for universal media controls via MPRIS2"

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic.git", features = ["applet", "tokio", "winit", "wayland"] }
zbus = "5.19"
zvariant = "5"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
futures = "0.3"
